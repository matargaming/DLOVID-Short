name: dlovid_short
description: Drama gold - DLOVID Short - Universal Android & Tablet
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.0
  google_sign_in: ^6.2.1
  video_player: ^2.8.2
  chewie: ^1.7.5
  http: ^1.1.2
  shared_preferences: ^2.2.2
  agora_rtc_engine: ^6.3.2
  google_mobile_ads: ^4.0.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  provider: ^6.1.1
  responsive_builder: ^0.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo_apk.png"
  min_sdk_android: 21
