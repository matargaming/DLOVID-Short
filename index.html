<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLOVID Short - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.bg{position:fixed;inset:0;background:radial-gradient(600px at 20% 10%, rgba(212,175,55,0.15), transparent),radial-gradient(800px at 90% 90%, rgba(255,215,0,0.12), transparent),#000;z-index:-1}
.phone{width:100%;max-width:420px;background:rgba(20,20,20,0.9);border:1px solid rgba(212,175,55,0.25);border-radius:32px;padding:28px 24px;box-shadow:0 0 60px rgba(212,175,55,0.15)}
.D{font-family:Cinzel,serif;font-size:92px;font-weight:800;background:linear-gradient(180deg,#FFF8DC,#FFD700,#8B6914);-webkit-background-clip:text;color:transparent;text-align:center}
.brand{font-family:Cinzel,serif;letter-spacing:6px;font-size:22px;text-align:center;background:linear-gradient(90deg,#D4AF37,#FFD700);-webkit-background-clip:text;color:transparent}
.welcome{font-family:Cinzel,serif;text-align:center;margin:24px 0 6px;font-size:20px}
.sub{font-size:12px;opacity:0.5;text-align:center;margin-bottom:20px}
.tabs{display:flex;background:rgba(0,0,0,0.6);border-radius:999px;padding:4px;margin-bottom:22px}
.tab{flex:1;padding:10px;border-radius:999px;border:0;background:transparent;color:#888;font-weight:600}
.tab.active{background:#2a2a2a;color:#fff}
.label{font-size:10px;letter-spacing:1.5px;color:#8a7a3a;margin:16px 0 8px;display:block}
.field{display:flex;align-items:center;background:rgba(0,0,0,0.5);border:1px solid rgba(212,175,55,0.18);border-radius:16px;padding:0 14px;height:52px}
.field input{flex:1;background:transparent;border:0;color:#fff;outline:none}
.btn{width:100%;height:54px;border-radius:16px;border:0;background:linear-gradient(180deg,#FFE27A,#D4A017);color:#000;font-weight:700;margin-top:22px}
.alert{padding:10px;border-radius:12px;font-size:12px;margin-top:12px;display:none}
.alert.err{display:block;background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.alert.ok{display:block;background:rgba(34,197,94,0.15);color:#86efac;border:1px solid rgba(34,197,94,0.3)}
.otp{display:flex;gap:8px;justify-content:center;margin:16px 0}
.otp input{width:44px;height:52px;text-align:center;font-size:18px;border-radius:12px;border:1px solid rgba(212,175,55,0.3);background:rgba(0,0,0,0.5);color:#FFD700}
</style>
</head>
<body>
<div class="bg"></div>
<div class="phone">
<div class="D">D</div>
<div class="brand">DLOVID — SHORT —</div>
<div class="welcome">Welcome Back</div>
<div class="sub">Login untuk melanjutkan ke DLOVID Short</div>
<div class="tabs"><button class="tab active" id="tabLogin" onclick="switchTab('login')">Login</button><button class="tab" id="tabDaftar" onclick="switchTab('daftar')">Daftar</button></div>
<div id="loginForm">
<span class="label">EMAIL / NO HP</span><div class="field"><input id="loginEmail" placeholder="nama@email.com / 0812xxxx"></div>
<span class="label">SANDI + intip</span><div class="field"><input id="loginPass" type="password" placeholder="••••••••"><button onclick="toggle('loginPass')" style="background:0;border:0;color:#888">👁️</button></div>
<div class="alert err" id="loginAlert"></div>
<button class="btn" onclick="doLogin()">Sign In →</button>
</div>
<div id="daftarForm" style="display:none">
<span class="label">EMAIL / NO HP</span><div class="field"><input id="regEmail" placeholder="nama@email.com"></div>
<span class="label">SANDI</span><div class="field"><input id="regPass" type="password" placeholder="min 6 char"><button onclick="toggle('regPass')" style="background:0;border:0">👁️</button></div>
<span class="label">CONFIRM SANDI</span><div class="field"><input id="regPass2" type="password"><button onclick="toggle('regPass2')" style="background:0;border:0">👁️</button></div>
<span class="label">KODE REFERRAL *WAJIB</span><div class="field" style="border-color:#FFD700"><input id="regRef" placeholder="DLOVID-OWNER-001"></div>
<div class="alert err" id="regAlert"></div><div class="alert ok" id="regOk"></div>
<button class="btn" onclick="doDaftar()">Daftar & OTP →</button>
<p style="font-size:11px;margin-top:10px;color:#c9b26a">Tanpa referral = DITOLAK. Kode pertama dari pemilik apk.</p>
</div>
<div id="otpForm" style="display:none">
<span class="label">OTP VIA HP/EMAIL</span>
<div class="otp"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"></div>
<div class="alert err" id="otpAlert"></div>
<button class="btn" onclick="alert('Demo OTP: 123456 - OTP Valid!')">Verifikasi OTP (Demo 123456)</button>
</div>
</div>
<script>
function toggle(id){let el=document.getElementById(id);el.type=el.type==='password'?'text':'password'}
function switchTab(t){document.getElementById('loginForm').style.display=t==='login'?'block':'none';document.getElementById('daftarForm').style.display=t==='daftar'?'block':'none';document.getElementById('otpForm').style.display=t==='otp'?'block':'none';document.getElementById('tabLogin').classList.toggle('active',t==='login');document.getElementById('tabDaftar').classList.toggle('active',t==='daftar')}
function show(id,msg,ok){let el=document.getElementById(id);el.textContent=msg;el.className='alert '+(ok?'ok':'err');el.style.display='block'}
function doLogin(){let e=document.getElementById('loginEmail').value,p=document.getElementById('loginPass').value;if(!e||!p)return show('loginAlert','❌ DITOLAK: Email/No HP & Sandi wajib');if(p.length<6)return show('loginAlert','❌ DITOLAK: Sandi tidak sesuai');show('loginAlert','✅ OTP dikirim ke '+e+' (123456)',true);setTimeout(()=>switchTab('otp'),1000)}
function doDaftar(){let e=document.getElementById('regEmail').value,p=document.getElementById('regPass').value,p2=document.getElementById('regPass2').value,r=document.getElementById('regRef').value;if(!e||!p||!r)return show('regAlert','❌ DITOLAK APK: Wajib isi referral!');if(r==='')return show('regAlert','❌ Daftar tanpa referral ditolak!');if(p!==p2)return show('regAlert','❌ Confirm sandi tidak sama');if(!r.startsWith('DLOVID-'))return show('regAlert','❌ Kode referral harus DLOVID-OWNER-001');show('regOk','✅ Valid! OTP: 123456',true);setTimeout(()=>switchTab('otp'),1000)}
</script>
</body>
</html>
