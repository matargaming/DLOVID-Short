name: Build DLOVID
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Decode Firebase
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json || echo "no json"
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> gradle.properties
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >> gradle.properties
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> gradle.properties
      - name: Build Debug with Full Log
        run:./gradlew assembleDebug --stacktrace --info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DLOVID-APK
          path: app/build/outputs/apk/debug/*.apk
