name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create google-services.json
        run: |
          cat > android/app/google-services.json <<'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF
          echo "File created:"
          ls -lh android/app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK REAL
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_KEY_1: ${{ secrets.ADMIN_KEY_1 }}
          ADMIN_KEY_2: ${{ secrets.ADMIN_KEY_2 }}
          ADMIN_KEY_3: ${{ secrets.ADMIN_KEY_3 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTER_ID: ${{ secrets.ADMOB_INTER_ID }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE: ${{ secrets.AGORA_APP_CERTIFICATE }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DLOVID-APK
          path: android/app/build/outputs/apk/debug/*.apk
