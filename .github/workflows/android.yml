name: build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json from Secret
        run: |
          # Coba decode base64 dulu, kalau gagal pakai raw json
          if echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json 2>/dev/null; then
            echo "✅ Decoded from base64 secret"
          else
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
            echo "✅ Used raw json secret"
          fi
          ls -lh app/google-services.json
          cat app/google-services.json | head -5

      - name: Build UNIVERSAL APK (SIGNED)
        run: gradle assembleDebug --stacktrace

      - name: Upload UNIVERSAL APK
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-Short-UNIVERSAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
