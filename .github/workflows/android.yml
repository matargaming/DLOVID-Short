name: Android CI - DLOVID-UNIVERSAL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dlovid-short",
              "firebase_url": "https://dlovid-short-default-rtdb.firebaseio.com",
              "storage_bucket": "dlovid-short.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef",
                "android_client_info": {
                  "package_name": "com.dlovid.dlovids"
                }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummyKey123" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Create local.properties from Secrets
        run: |
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> local.properties
          echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >> local.properties
          echo "ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}" >> local.properties
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >> local.properties
          echo "AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}" >> local.properties
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> local.properties
          echo "MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}" >> local.properties
          echo "MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}" >> local.properties
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> local.properties
          echo "ADMIN_KEY_1=${{ secrets.ADMIN_KEY_1 }}" >> local.properties
          echo "ADMIN_KEY_2=${{ secrets.ADMIN_KEY_2 }}" >> local.properties
          echo "ADMIN_KEY_3=${{ secrets.ADMIN_KEY_3 }}" >> local.properties
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> local.properties

      - name: Build UNIVERSAL APK
        run: gradle assembleRelease --stacktrace

      - name: Upload UNIVERSAL APK
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-Short-UNIVERSAL-APK
          path: app/build/outputs/apk/release/*.apk
