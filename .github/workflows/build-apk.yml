name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Rebuild Android Folder (Fix Gradle)
        run: |
          echo "Backup lib..."
          mv lib lib_backup || true
          echo "Hapus android rusak..."
          rm -rf android
          echo "Buat android baru V2..."
          flutter create . --platforms=android --project-name dlovid_short --org com.matargaming --no-pub
          echo "Restore lib..."
          rm -rf lib
          mv lib_backup lib
          ls -la android/
      - name: Get Packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-APK
          path: build/app/outputs/flutter-apk/app-release.apk
