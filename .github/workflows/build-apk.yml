name: Build DLOVID Gold Production
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name dlovid_short
          fi

      - name: Setup Firebase
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > /tmp/gs.txt
          if base64 -d /tmp/gs.txt > android/app/google-services.json 2>/dev/null; then
            echo "Firebase OK"
          else
            cp /tmp/gs.txt android/app/google-services.json
          fi

      - name: Create .env from Secrets
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >> .env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >> .env
          echo "ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}" >> .env
          echo "MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}" >> .env
          echo "MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}" >> .env
          echo "LIVE_COMMISSION=0.3" >> .env
          echo "CREATOR_COMMISSION=0.7" >> .env

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Gold Icon
        run: flutter pub run flutter_launcher_icons

      - name: Build APK Split (Lebih Bagus Dari TikTok Version)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./

      - name: Upload DLOVID APK GOLD
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-GOLD-LEBIH-BAGUS-DARI-TIKTOK
          path: build/app/outputs/flutter-apk/app-*-release.apk
