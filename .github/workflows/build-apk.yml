name: Build DLOVID AAB Playstore
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: SERVER ONLINE - Firebase
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          echo "=== SERVER FIREBASE CONNECT ==="
          ls -lh android/app/google-services.json
          if [! -s android/app/google-services.json ]; then echo "ERROR: google-services.json kosong!"; exit 1; fi

      - name: SERVER ONLINE - 14 Secrets Conek
        run: |
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >.env
          echo "ADMIN_KEY_1=${{ secrets.ADMIN_KEY_1 }}" >>.env
          echo "ADMIN_KEY_2=${{ secrets.ADMIN_KEY_2 }}" >>.env
          echo "ADMIN_KEY_3=${{ secrets.ADMIN_KEY_3 }}" >>.env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >>.env
          echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >>.env
          echo "ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}" >>.env
          echo "ADMOB_REWARDED_ID=${{ secrets.ADMOB_INTER_ID }}" >>.env
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >>.env
          echo "TMDB_KEY=${{ secrets.TMDB_API_KEY }}" >>.env
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >>.env
          echo "AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}" >>.env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >>.env
          echo "MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}" >>.env
          echo "MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}" >>.env
          echo "=== SERVER 14 SECRETS ONLINE ==="
          cat.env

      - name: Build AAB
        run: |
          flutter pub get
          flutter build appbundle --release --no-tree-shake-icons

      - name: Upload AAB Playstore
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-Short-AAB-ONLINE
          path: build/app/outputs/bundle/release/*.aab
