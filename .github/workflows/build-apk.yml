name: Build APK DLOVID
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create Android Project
        run: flutter create. --platforms=android --project-name dlovid_short
      - name: Setup google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
      - name: Create env secrets
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >>.env
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >>.env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >>.env
          echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >>.env
          echo "ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}" >>.env
          echo "MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}" >>.env
          echo "MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}" >>.env
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK Release
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-Short-APK
          path: build/app/outputs/flutter-apk/app-release.apk
