name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
      - name: Build APK
        run: |
          flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }} --dart-define=ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} --dart-define=ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }} --dart-define=ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }} --dart-define=MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }} --dart-define=MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: dlovid-release
          path: build/app/outputs/flutter-apk/app-release.apk
