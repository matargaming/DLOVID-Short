name: Build DLOVID Playstore AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.19.0' }
      - name: Create.env from Real Secrets
        run: |
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >>.env
          echo "ADMIN_KEY_1=${{ secrets.ADMIN_KEY_1 }}" >>.env
          echo "ADMIN_KEY_2=${{ secrets.ADMIN_KEY_2 }}" >>.env
          echo "ADMIN_KEY_3=${{ secrets.ADMIN_KEY_3 }}" >>.env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >>.env
          echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >>.env
          echo "ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}" >>.env
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >>.env
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >>.env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >>.env
      - run: flutter build appbundle --release
