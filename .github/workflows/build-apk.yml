
name: Build DLOVID APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/dlovids/short
          # Move files if they are in root
          cp index.html app/src/main/assets/index.html || true
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml || echo "manifest not in root"
          cp MainActivity.java app/src/main/java/com/dlovids/short/MainActivity.java || echo "java not in root"
          
          # Create build.gradle if not exists
          if [ ! -f app/build.gradle ]; then
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.dlovids.short'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dlovids.short"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          EOF
          fi
          
          if [ ! -f build.gradle ]; then
            echo "include ':app'" > settings.gradle
            echo "plugins { id 'com.android.application' version '8.1.0' apply false }" > build.gradle
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew || true
          # If no gradlew, build with manual gradle
          gradle :app:assembleDebug --no-daemon || ./gradlew :app:assembleDebug --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-Short-APK
          path: app/build/outputs/apk/debug/*.apk
          
