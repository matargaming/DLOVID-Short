name: Build DLOVID Gold Legal
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Android Folder If Missing
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android folder missing, creating..."
            flutter create . --platforms=android --project-name dlovid_short --org com.matargaming.dlovid
          fi
          ls -la android/app/src/main/

      - name: Setup Firebase
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > /tmp/gs.txt
            if base64 -d /tmp/gs.txt > android/app/google-services.json 2>/dev/null; then
              echo "Firebase OK base64"
            else
              cp /tmp/gs.txt android/app/google-services.json
              echo "Firebase OK plain"
            fi
          else
            echo "No Firebase secret, skip"
          fi

      - name: Create .env from Secrets
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >> .env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >> .env
          echo "ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}" >> .env
          echo "MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}" >> .env
          echo "MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}" >> .env
          echo "LIVE_COMMISSION=0.3" >> .env
          echo "CREATOR_COMMISSION=0.7" >> .env

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Gold Icon (Safe Mode)
        continue-on-error: true
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            flutter pub run flutter_launcher_icons || echo "Icon skip, lanjut build"
          else
            echo "AndroidManifest not found, skip icon"
          fi

      - name: Build APK Split Legal Gold
        run: flutter build apk --release --split-per-abi

      - name: Upload DLOVID APK GOLD LEGAL
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-GOLD-LEGAL-HIJAU
          path: build/app/outputs/flutter-apk/app-*-release.apk
