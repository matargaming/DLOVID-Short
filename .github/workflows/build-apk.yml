name: Build APK - Full Online Universal + Secret
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Rebuild Android Clean
        run: |
          mv lib lib_backup || true
          rm -rf android
          flutter create . --platforms=android --project-name dlovid_short --org com.matargaming --no-pub
          rm -rf lib
          mv lib_backup lib

      - name: Connect GOOGLE_SERVICES_JSON from Secret
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          echo "Google JSON connected from secret!"
          ls -lh android/app/google-services.json

      - name: Get Packages
        run: flutter pub get

      - name: Build APK with TMDB Secret
        run: flutter build apk --release --no-tree-shake-icons --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLOVID-FULL-ONLINE-TMDB
          path: build/app/outputs/flutter-apk/app-release.apk
