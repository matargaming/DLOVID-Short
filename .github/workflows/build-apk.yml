name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GS_JSON" > android/app/google-services.json
          ls -lh android/app/google-services.json
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }} --dart-define=ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} --dart-define=ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }} --dart-define=ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }} --dart-define=MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }} --dart-define=MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dlovid-release
          path: build/app/outputs/flutter-apk/app-release.apk
