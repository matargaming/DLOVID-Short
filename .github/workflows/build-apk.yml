name: Build Universal APK & AAB PlayStore

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Decode google-services.json
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          # Cek apakah secret adalah JSON mentah atau base64
          if echo "$GOOGLE_JSON" | grep -q "project_info"; then
            echo "Detected raw JSON, writing directly..."
            printf '%s' "$GOOGLE_JSON" > android/app/google-services.json
          else
            echo "Detected base64, decoding..."
            printf '%s' "$GOOGLE_JSON" | base64 --decode > android/app/google-services.json
          fi
          echo "google-services.json created:"
          ls -lh android/app/google-services.json
          head -n 5 android/app/google-services.json

      - name: Pub get
        run: flutter pub get

      - name: Build APK Universal (HP & Tablet)
        run: |
          flutter build apk --release --no-split-per-abi \
            --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            --dart-define=MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }} \
            --dart-define=MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }} \
            --dart-define=ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} \
            --dart-define=ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }} \
            --dart-define=ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}

      - name: Build AAB Play Store
        run: |
          flutter build appbundle --release \
            --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            --dart-define=MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }} \
            --dart-define=MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }} \
            --dart-define=ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} \
            --dart-define=ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }} \
            --dart-define=ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}

      - name: Upload APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: dlovid-universal
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
