name: Build DLOVID-Short Universal

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Create env file from Secrets
        run: |
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >>.env
          echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >>.env
          echo "ADMOB_INTER_ID=${{ secrets.ADMOB_INTER_ID }}" >>.env
          echo "AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}" >>.env
          echo "AGORA_CERT=${{ secrets.AGORA_APP_CERTIFICATE }}" >>.env
          echo "FIREBASE_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >>.env
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >>.env
          echo "ADMIN_KEY_1=${{ secrets.ADMIN_KEY_1 }}" >>.env
          echo "ADMIN_KEY_2=${{ secrets.ADMIN_KEY_2 }}" >>.env
          echo "ADMIN_KEY_3=${{ secrets.ADMIN_KEY_3 }}" >>.env
          echo "TMDB_KEY=${{ secrets.TMDB_API_KEY }}" >>.env
          echo "MIDTRANS_CLIENT=${{ secrets.MIDTRANS_CLIENT_KEY }}" >>.env
          echo "MIDTRANS_SERVER=${{ secrets.MIDTRANS_SERVER_KEY }}" >>.env
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Build Universal APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: DLOVID-Short-Universal
          path: build/app/outputs/flutter-apk/*.apk
