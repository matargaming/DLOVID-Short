name: Build DLOVID Short Playstore

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > dlovid_short/android/app/google-services.json

      - name: Build App Bundle Playstore
        run: |
          cd dlovid_short
          flutter pub get
          flutter build appbundle --release \
            --dart-define=ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }} \
            --dart-define=ADMIN_KEY_1=${{ secrets.ADMIN_KEY_1 }} \
            --dart-define=ADMIN_KEY_2=${{ secrets.ADMIN_KEY_2 }} \
            --dart-define=ADMIN_KEY_3=${{ secrets.ADMIN_KEY_3 }} \
            --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
            --dart-define=ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }} \
            --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: dlovid-short-playstore
          path: dlovid_short/build/app/outputs/bundle/release/app-release.aab
